<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f3a;--panel:#f8f0d8;--ink:#202020;--acc:#e84d3d;--ok:#3cb44b;--hp:#48c860;--card:#2c3263;--txt:#f8f0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111426;--card:#222850}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.7;min-height:100vh;image-rendering:pixelated}
img{image-rendering:pixelated;max-width:100%}
.scr{display:none;max-width:760px;margin:0 auto;padding:14px}.scr.on{display:block}
h1{font-size:clamp(20px,6vw,34px);text-align:center;color:#ffd23f;text-shadow:3px 3px #e84d3d;margin:20px 0}
h2{font-size:15px;text-align:center;color:#ffd23f}
button{font:inherit;font-size:11px;background:var(--panel);color:var(--ink);border:3px solid #202020;box-shadow:3px 3px #000;padding:10px 12px;cursor:pointer;min-height:44px}
button:active{transform:translate(2px,2px);box-shadow:1px 1px #000}button:disabled{opacity:.5}
.menu{display:grid;gap:12px;max-width:340px;margin:20px auto}
.box{background:var(--panel);color:var(--ink);border:4px solid #202020;outline:3px solid #6a6a8a;padding:10px;border-radius:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:3px solid #000;padding:8px;text-align:center;cursor:pointer}
.card.sel{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f}
.card img{width:100%;height:190px;object-fit:cover;object-position:top;border:3px solid #000}
.card small{display:block;font-size:9px;color:#cfd2f5}
.arena{position:relative;height:320px;border:4px solid #000;overflow:hidden;background:linear-gradient(#8fd0ff 0 45%,#9be37a 45% 100%)}
.pf{position:absolute;width:150px;height:46px;background:#6fbf4f;border-radius:50%;border:3px solid #4a9a3a}
.spr{position:absolute;width:118px;height:158px;object-fit:cover;object-position:top;border:3px solid #000;background:#000;transition:transform .25s}
.info{position:absolute;width:52%;max-width:250px;font-size:9px;padding:6px 8px}
.hpb{height:10px;background:#555;border:2px solid #202020;margin-top:4px}.hpb i{display:block;height:100%;background:var(--hp);transition:width .6s,background .3s}
.lg{display:flex;justify-content:space-between;font-size:8px;margin-top:3px}
.turn{outline-color:#e84d3d}
.bottom{display:grid;grid-template-columns:1fr 150px;gap:6px;margin-top:6px}
.msg{min-height:130px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ops button{text-align:left}
.q{font-size:clamp(18px,6vw,28px);text-align:center;margin:6px 0}
.q+div{display:flex;gap:6px}input{font:inherit;font-size:16px;flex:1;min-width:0;padding:8px;border:3px solid #202020}
.tm{height:12px;background:#555;border:2px solid #202020}.tm i{display:block;height:100%;background:var(--acc);width:100%}
.shake{animation:sh .4s}.flash{animation:fl .5s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes fl{50%{filter:brightness(3) hue-rotate(120deg)}}
.lunge{transform:translate(var(--dx),var(--dy))!important}
.tbl{width:100%;font-size:9px;border-collapse:collapse}.tbl td,.tbl th{border-bottom:2px solid #aaa;padding:4px;text-align:left}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.ov.on{display:flex}
.ov .box{max-width:520px;max-height:85vh;overflow:auto}
label{display:block;margin:10px 0}
@media(max-width:520px){.bottom{grid-template-columns:1fr}.spr{width:96px;height:130px}}
</style></head><body>

<section class="scr on" id="menu">
<h1>PIXEL<br>BATTLE</h1><p style="text-align:center">Batalha de matemática por turnos</p>
<div class="menu">
<button onclick="go('select')">▶ JOGAR (2 JOGADORES)</button>
<button onclick="openLobby()">MULTIPLAYER ONLINE</button>
<button onclick="go('tut')">TUTORIAL</button>
<button onclick="showStats()">ESTATÍSTICAS</button>
<button onclick="go('cfg')">CONFIGURAÇÕES</button></div></section>

<section class="scr" id="select">
<h2 id="selT">JOGADOR 1: ESCOLHA</h2><div class="cards" id="cards"></div>
<p style="text-align:center"><button onclick="go('menu')">VOLTAR</button></p></section>

<section class="scr" id="battle">
<div class="arena" id="arena">
<div class="pf" style="right:6%;top:36%"></div><div class="pf" style="left:8%;bottom:6%"></div>
<img class="spr" id="s1" style="left:10%;bottom:12%" alt=""><img class="spr" id="s0" style="right:8%;top:8%" alt="">
<div class="box info" id="i1" style="right:2%;bottom:4%"></div><div class="box info" id="i0" style="left:2%;top:6%"></div>
</div>
<div class="bottom"><div class="box msg" id="msg"></div>
<div class="box" id="side" style="font-size:9px"></div></div>
<p style="text-align:center"><button onclick="ov('tutOv',1)">? AJUDA</button> <button onclick="if(confirm('Sair da batalha?'))quit()">SAIR</button></p></section>

<section class="scr" id="lobby"><h2>MULTIPLAYER</h2><p id="lobMsg" style="text-align:center;min-height:20px"></p>
<div id="lobHome" class="menu"><button onclick="mkRoom()">CRIAR SALA</button><input id="code" placeholder="CÓDIGO" maxlength="6" style="text-transform:uppercase;text-align:center"><button onclick="joinR()">ENTRAR NA SALA</button><button id="recBtn" style="display:none" onclick="joinR(ld('pb_room',''))">RECONECTAR</button><button onclick="go('menu')">VOLTAR</button></div>
<div id="lobRoom" style="display:none"><div class="box" style="text-align:center">CÓDIGO DA SALA<div class="q" id="rCode"></div><small>Passe o código ao outro jogador</small></div><div class="box" id="rPl" style="margin-top:8px"></div><h2>ESCOLHA SEU PERSONAGEM</h2><div class="cards" id="rCards"></div><p style="text-align:center"><button id="rdy" onclick="oReady()">ESTOU PRONTO</button> <button onclick="oLeave()">SAIR DA SALA</button></p></div></section>

<section class="scr" id="res"><h2 id="rT"></h2><div class="box" id="rB"></div>
<div class="menu"><button onclick="go('select')">JOGAR NOVAMENTE</button><button onclick="openLobby()">MULTIPLAYER</button><button onclick="go('menu')">MENU</button></div></section>

<section class="scr" id="tut"><h2>TUTORIAL</h2><div class="box" id="tutB"></div><p style="text-align:center"><button onclick="go('menu')">VOLTAR</button></p></section>

<section class="scr" id="stats"><h2>ESTATÍSTICAS</h2><div class="box" id="stB"></div><p style="text-align:center"><button onclick="go('menu')">VOLTAR</button> <button onclick="if(confirm('Apagar histórico?')){localStorage.removeItem('pb_h');showStats()}">LIMPAR</button></p></section>

<section class="scr" id="cfg"><h2>CONFIGURAÇÕES</h2><div class="box">
<label>Vida inicial: <b id="hv"></b><input type="range" id="hpR" min="60" max="200" step="10"></label>
<label>Dano base: <b id="dv"></b><input type="range" id="dmR" min="10" max="40" step="5"></label>
<label><input type="checkbox" id="snd" style="width:auto"> Efeitos sonoros</label></div>
<p style="text-align:center"><button onclick="go('menu')">VOLTAR</button></p></section>

<div class="ov" id="tutOv"><div class="box"><div id="tutB2"></div><p style="text-align:center"><button onclick="ov('tutOv',0)">FECHAR</button></p></div></div>

 $('stB').innerHTML='<p>Partidas: '+H.length+'</p><b>Aproveitamento por operação</b>'+Object.keys(ag).map(function(k){var t=ag[k][0]+ag[k][1],pc=t?Math.round(ag[k][0]/t*100):0;return '<div style="margin:6px 0">'+OPS[k][0]+': '+pc+'% ('+ag[k][0]+'/'+t+')<div class="hpb"><i style="width:'+pc+'%"></i></div></div>'}).join('')+'<br><b>Histórico</b><table class="tbl"><tr><th>Data</th><th>Vencedor</th><th>Pts J1/J2</th></tr>'+H.slice(0,15).map(function(h){return '<tr><td>'+h.date+'</td><td>'+h.win+'</td><td>'+h.p[0].sc+' / '+h.p[1].sc+'</td></tr>'}).join('')+'</table>'}
/* ================= MULTIPLAYER ONLINE (Supabase) ================= */
var SB_URL='https://sesppgzjqhilixbvirob.supabase.co',SB_KEY='sb_publishable_yXM-VwkNse7FCbH6lBviKA_B5yq81Im';
var sb=null,ME=null,O=null,busy=false;
function lob(m){$('lobMsg').textContent=m||''}
async function initSb(){
 if(sb&&ME)return true;
 try{
  if(!window.supabase)throw new Error('biblioteca do Supabase não carregou (sem internet?)');
  sb=sb||window.supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();
  if(s.data.session){ME=s.data.session.user}
  else{var r=await sb.auth.signInAnonymously();if(r.error)throw r.error;ME=r.data.user}
  return true
 }catch(e){lob('Erro de conexão: '+(e.message||e)+' (habilite Anonymous sign-ins no Supabase)');return false}}
async function rpc(fn,a){var r=await sb.rpc(fn,a);if(r.error)throw r.error;return r.data}
async function openLobby(){
 go('lobby');
 if(O){oRender();return}
 $('lobHome').style.display='block';$('lobRoom').style.display='none';lob('Conectando...');
 if(await initSb()){lob('Conectado.');var c=ld('pb_room',null);$('recBtn').style.display=c?'block':'none';if(c)$('recBtn').textContent='RECONECTAR ('+c+')'}}
async function mkRoom(){lob('Criando sala...');try{if(!await initSb())return;enter(await rpc('create_room',{p_hp:CFG.hp,p_damage:CFG.dm}));lob('')}catch(e){lob('Erro: '+(e.message||e))}}
async function joinR(code){code=(code||$('code').value||'').trim();if(!code)return lob('Digite o código da sala.');
 try{lob('Entrando...');if(!await initSb())return;enter(await rpc('join_room',{p_code:code}));lob('')}catch(e){lob('Erro: '+(e.message||e))}}
function enter(r){
 leaveWatch();
 O={id:r.id,code:r.code,room:r,pl:[],q:null,seen:{},lastRes:null,lrTxt:'',key:'',ended:false,loadedAt:Date.now()};
 sv('pb_room',r.code);$('rCode').textContent=r.code;
 var ch=sb.channel('r-'+r.id);
 ['rooms','room_players','questions'].forEach(function(t){
  ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:(t=='rooms'?'id=eq.':'room_id=eq.')+r.id},refresh)});
 ch.subscribe();O.ch=ch;
 O.poll=setInterval(refresh,3000);                         // reserva caso o realtime falhe
 O.hb=setInterval(function(){
  sb.rpc('heartbeat',{p_room:r.id});
  var o=opp();if(O.room.status=='playing'&&o&&Date.now()-new Date(o.last_seen)>55000)
   rpc('claim_abandon',{p_room:r.id}).then(refresh).catch(function(){})},10000);
 $('lobHome').style.display='none';$('lobRoom').style.display='block';
 refresh()}
function leaveWatch(){if(!O)return;clearInterval(O.hb);clearInterval(O.poll);clearInterval(O.tm);try{sb.removeChannel(O.ch)}catch(e){}O=null}
async function oLeave(){if(!O){go('menu');return}var id=O.id;try{await rpc('leave_room',{p_room:id})}catch(e){}sv('pb_room',null);leaveWatch();go('menu')}
function mine(){return O.pl.filter(function(p){return p.user_id==ME.id})[0]}
function opp(){return O?O.pl.filter(function(p){return p.user_id!=ME.id})[0]:null}
function chOf(p){return CH.filter(function(c){return c.id==p.character_id})[0]}
async function refresh(){
 if(!O||busy)return;busy=true;var id=O.id;
 try{
  var a=await sb.from('rooms').select('*').eq('id',id).single();if(a.error)throw a.error;
  var b=await sb.from('room_players').select('*').eq('room_id',id).order('slot');if(b.error)throw b.error;
  var q=null;if(a.data.question_id){var c=await sb.from('questions').select('*').eq('id',a.data.question_id).single();q=c.data}
  if(!O||O.id!=id)return;
  O.room=a.data;O.pl=b.data||[];O.q=q;oRender()
 }catch(e){lob('Erro: '+(e.message||e))}finally{busy=false}}
async function oPick(c){try{await rpc('select_character',{p_room:O.id,p_char:c});beep(660);refresh()}catch(e){lob('Erro: '+(e.message||e))}}
async function oReady(){var m=mine();try{await rpc('set_ready',{p_room:O.id,p_ready:!(m&&m.ready)});refresh()}catch(e){lob('Erro: '+(e.message||e))}}
function oRender(){
 var r=O.room;
 if(r.status=='waiting')return showRoom();
 if(r.status=='finished')return oEnd();
 if(!$('battle').classList.contains('on')){go('battle');O.key=''}
 var m=mine(),o=opp();if(!m||!o||!m.character_id||!o.character_id)return;
 var cm=chOf(m),co=chOf(o);
 $('s1').src=IMG[cm.id];$('s0').src=IMG[co.id];
 oInfo('i1',m,'VOCÊ '+cm.n);
 oInfo('i0',o,'ADV. '+co.n+(Date.now()-new Date(o.last_seen)<40000?'':' ○OFF'));
 $('side').innerHTML='VEZ: '+(r.current_attacker==ME.id?'VOCÊ':'ADV.')+'<br>PTS: '+m.score+' x '+o.score+'<br>SEQ: '+m.streak+'<br>SALA: '+O.code;
 var lr=r.last_result;
 if(lr&&lr.question_id!=O.lastRes){
  var first=O.lastRes===null&&Date.now()-O.loadedAt<4000;O.lastRes=lr.question_id;O.lrTxt=oResTxt(lr);if(!first)oFx(lr)}
 var key=r.phase=='answer'?'a'+r.question_id:'c'+r.current_attacker+(lr?lr.question_id:'0');
 if(r.phase=='answer'&&!O.q)return;
 if(key!=O.key){O.key=key;clearInterval(O.tm);if(r.phase=='answer')oAnswerUI();else oChooseUI()}}
function oInfo(id,p,lab){var hs=O.room.hp_start,pc=Math.max(0,p.hp/hs*100);
 $(id).className='box info'+(O.room.current_attacker==p.user_id?' turn':'');
 $(id).innerHTML='<b>'+lab+'</b><div class="hpb"><i style="width:'+pc+'%;'+(pc<25?'background:#e84d3d':pc<50?'background:#f0c030':'')+'"></i></div><div class="lg"><span>HP</span><span>'+p.hp+'/'+hs+'</span></div>'}
function oResTxt(lr){var md=lr.defender_id==ME.id;
 if(lr.correct)return md?'Resposta correta! Você defendeu o ataque! +'+lr.points+' pts':'O adversário defendeu o ataque ('+lr.prompt+' = '+lr.right_answer+').';
 return (md?(lr.timed_out?'Tempo encerrado! Você não conseguiu defender!':'Resposta incorreta! Você recebeu dano!'):'Seu ataque acertou!')+' −'+lr.damage+' HP<br>Correto: '+lr.explanation}
function oFx(lr){var id=lr.defender_id==ME.id?'s1':'s0',e=$(id);e.classList.add(lr.correct?'flash':'shake');setTimeout(function(){e.classList.remove('flash');e.classList.remove('shake')},500);beep(lr.correct?880:150,.25)}
function oChooseUI(){
 var pre=O.lrTxt?'<div style="font-size:9px;margin-bottom:6px">'+O.lrTxt+'</div>':'';
 if(O.room.current_attacker!=ME.id){$('msg').innerHTML=pre+'<div>Aguardando o adversário escolher o ataque...</div>';return}
 var c=chOf(mine());
 $('msg').innerHTML=pre+'<div>Sua vez! Escolha seu ataque:</div><div class="ops" style="margin-top:8px">'+Object.keys(OPS).map(function(k){
  return '<button onclick="oAtk(\''+k+'\')">▶ '+OPS[k][0]+((k==c.sp||k==c.sp2)?' ★':'')+'</button>'}).join('')+'</div>'}
async function oAtk(op){
 document.querySelectorAll('#msg .ops button').forEach(function(b){b.disabled=true});beep(440);lunge(1,true);setTimeout(function(){lunge(1,false)},400);
 try{await rpc('choose_attack',{p_room:O.id,p_op:op})}catch(e){lob('Erro: '+(e.message||e))}refresh()}
function oAnswerUI(){
 var q=O.q,end=O.seen[q.id];
 if(!end){end=(Date.now()-O.loadedAt<4000)?new Date(q.deadline).getTime():Date.now()+14700;O.seen[q.id]=end}
 var isDef=q.defender_id==ME.id,done=false;
 $('msg').innerHTML='<div>'+(isDef?'Defenda! ':'Adversário respondendo... ')+OPS[q.op][0]+(q.is_special?' ★ (golpe forte)':'')+'</div><div class="q">'+q.prompt+' = ?</div><div class="tm"><i id="tb"></i></div>'+
  (isDef?'<div style="margin-top:8px;display:flex;gap:6px"><input id="ans" type="number" inputmode="numeric" autocomplete="off"><button id="ok">OK</button></div>':'')+'<div id="tl" style="font-size:9px;margin-top:4px">15s</div>';
 if(isDef){var inp=$('ans');inp.focus();
  $('ok').onclick=async function(){var v=Number(inp.value);if(done||inp.value===''||!Number.isInteger(v))return;done=true;$('ok').disabled=true;
   try{await rpc('submit_answer',{p_room:O.id,p_value:v})}catch(e){lob('Erro: '+(e.message||e))}refresh()};
  inp.onkeydown=function(e){if(e.key=='Enter')$('ok').onclick()}}
 clearInterval(O.tm);
 O.tm=setInterval(function(){var l=Math.max(0,end-Date.now());var tb=$('tb');if(!tb){clearInterval(O.tm);return}
  tb.style.width=(l/150)+'%';$('tl').textContent=Math.ceil(l/1000)+'s';
  if(l<=0){clearInterval(O.tm);if(!done){done=true;oTimeout(0)}}},100)}
async function oTimeout(n){
 try{await rpc('resolve_timeout',{p_room:O.id})}
 catch(e){if(n<6&&/dentro do tempo/.test(e.message||'')){setTimeout(function(){if(O)oTimeout(n+1)},700);return}}
 if(O)refresh()}
function showRoom(){
 if(!$('lobby').classList.contains('on'))go('lobby');
 $('lobHome').style.display='none';$('lobRoom').style.display='block';
 var m=mine();
 $('rPl').innerHTML=[1,2].map(function(s){var p=O.pl.filter(function(x){return x.slot==s})[0];
  if(!p)return '<p>J'+s+': aguardando jogador...</p>';var c=p.character_id?chOf(p):null,on=Date.now()-new Date(p.last_seen)<40000;
  return '<p>J'+s+(p.user_id==ME.id?' (você)':'')+': '+(c?c.n:'escolhendo...')+'<br>'+(p.ready?'✔ PRONTO':'não pronto')+' | '+(on?'● online':'○ offline')+'</p>'}).join('');
 $('rCards').innerHTML=CH.map(function(c){return '<div class="card'+(m&&m.character_id==c.id?' sel':'')+'" onclick="oPick(\''+c.id+'\')"><img src="'+IMG[c.id]+'" alt="'+c.n+'"><b>'+c.n+'</b><small>'+c.spn+'</small></div>'}).join('');
 $('rdy').textContent=m&&m.ready?'CANCELAR PRONTO':'ESTOU PRONTO';$('rdy').disabled=!(m&&m.character_id)}
function oEnd(){
 if(O.ended)return;O.ended=true;clearInterval(O.tm);
 var w=O.room.winner_id==ME.id;
 $('rT').textContent=w?'VOCÊ VENCEU! 🏆':'VOCÊ PERDEU...';
 $('rB').innerHTML=O.pl.map(function(p){var t=p.correct+p.wrong,pc=t?Math.round(p.correct/t*100):0,c=p.character_id?chOf(p):{n:'?'};
  return '<p><b>'+(p.user_id==ME.id?'VOCÊ':'ADVERSÁRIO')+' — '+c.n+'</b> '+(p.user_id==O.room.winner_id?'🏆':'')+'<br>Questões: '+t+' | Acertos: '+p.correct+' | Erros: '+p.wrong+'<br>Aproveitamento: '+pc+'%<br>Pontos: '+p.score+' | Maior sequência: '+p.max_streak+'<br>Melhor: '+bw(p.ops,1)+'<br>Precisa praticar: '+bw(p.ops,0)+'</p>'}).join('<hr>');
 sv('pb_room',null);leaveWatch();go('res')}
